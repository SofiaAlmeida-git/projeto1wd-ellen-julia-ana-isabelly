<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personalização</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <script src="script.js"></script>
    <main>
        <section class="personalizacao">
            <h1>Personalize seu Buquê</h1>
            <p>Monte um buquê único, do seu jeito!</p>
        </section>

        <section class="escolhas">
            <div class="flores">
            <h2>Escolha as flores:</h2>
            <p>Escolha as flores para montar seu buquê.</p>
            <button>Rosa</button>
            <button>Tulipa</button>
            <button>Girassol</button>
            <button>Papoula</button>
            <button>Hibisco</button>
            <button>Lírio</button>
            <button>Margarida</button>
            <button>Lavanda</button>
            <button>Outras</button>
        </div>

        <div class="cores">
            <h2>Escolha as cores:</h2>
            <p>Escolhha as cores que combinam com seu estilo:</p>

            <button>Rosa</button>
            <button>Verde</button>
            <button>Amarelo</button>
            <button>Roxo</button>
            <button>Branco</button>
        </div>

        <div class="quantidade">
            <h3>Quantidade</h3>

            <button>-</button>
            <input type="number" value="1">
            <button>+</button>
        </div>
        </section>
    </main>
</body>
</html>
